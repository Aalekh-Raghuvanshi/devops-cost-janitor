name: Cost Janitor

# Run this workflow whenever a pull request is opened or updated.
on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cost-janitor:
    name: Terraform + Cost Janitor Scan
    runs-on: ubuntu-latest

    # LocalStack runs as a service container.
    # It simulates AWS APIs locally for Terraform and boto3.
    services:
      localstack:
        image: localstack/localstack:3.0
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3
          DEFAULT_REGION: us-east-1

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_ENDPOINT: http://localhost:4566

    steps:
      # Downloads repository code into the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Terraform on the runner.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # Installs Python so we can install tflocal and run the Janitor script.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Installs terraform-local.
      # tflocal is a wrapper that automatically points Terraform to LocalStack.
      - name: Install tflocal and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install terraform-local
          pip install -r janitor/requirements.txt

      # Waits until LocalStack is ready before Terraform tries to connect.
      - name: Wait for LocalStack
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q "running"; then
              echo "LocalStack is ready"
              exit 0
            fi
            echo "Waiting for LocalStack..."
            sleep 2
          done
          echo "LocalStack did not become ready in time"
          exit 1

      # Checks Terraform formatting.
      # This fails if .tf files are not formatted properly.
      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # Initializes Terraform and downloads required providers/modules.
      - name: Terraform init
        working-directory: terraform
        run: tflocal init

      # Validates Terraform syntax and configuration.
      - name: Terraform validate
        working-directory: terraform
        run: tflocal validate

      # Applies Terraform against LocalStack.
      # This creates fake AWS resources locally in the CI runner.
      - name: Terraform apply
        working-directory: terraform
        run: tflocal apply -auto-approve

      # Runs the Cost Janitor in dry-run mode.
      # continue-on-error is intentional because the assignment requires
      # non-zero exit when orphans are found, but we still need to upload reports.
      - name: Run Cost Janitor dry-run
        id: janitor
        continue-on-error: true
        run: |
          python janitor/janitor.py \
            --dry-run \
            --region us-east-1 \
            --endpoint-url http://localhost:4566 \
            --report-json report.json \
            --report-md report.md

      # Uploads generated reports so reviewers can download them from GitHub Actions.
      - name: Upload Cost Janitor reports
        uses: actions/upload-artifact@v4
        with:
          name: cost-janitor-reports
          path: |
            report.json
            report.md
          if-no-files-found: error

      # Adds the Markdown report as a PR comment.
      # This makes the finding visible directly on the pull request.
      - name: Comment report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            let body = "## Cost Janitor Report\n\n";
            if (fs.existsSync("report.md")) {
              body = fs.readFileSync("report.md", "utf8");
            } else {
              body += "No report.md file was generated.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # Fails the workflow if the Janitor found orphans in dry-run mode.
      # This preserves the assignment behavior after reports/comments are created.
      - name: Fail if Cost Janitor found issues
        if: steps.janitor.outcome == 'failure'
        run: |
          echo "Cost Janitor found orphaned or non-compliant resources."
          exit 1
